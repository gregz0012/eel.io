# Deploys the free web build to the eelshock.com Workers Static Assets service.
# The game remains a self-contained file and keeps working offline; Cloudflare
# is only the production host for the exact artifact produced by build:web.
name: web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-production
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Test production source
        run: npm run check

      - name: Build web artifact
        run: npm run build:web

      - name: Check deployment credentials
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_WEB_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=""
          if [ -z "$TOKEN" ]; then missing="$missing CLOUDFLARE_WEB_API_TOKEN"; fi
          if [ -z "$ACCOUNT" ]; then missing="$missing CLOUDFLARE_ACCOUNT_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — see README.md#web-production-deployment."
            exit 1
          fi

      - name: Deploy eelshock.com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WEB_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/wrangler deploy --config wrangler.web.jsonc
