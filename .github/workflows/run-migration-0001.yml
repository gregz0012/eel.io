# One-off, manually-triggered: applies worker/migrations/0001_add_level.sql
# to the live D1 database. This is not meant to stay in the repo — it exists
# only because this session has no local Cloudflare credentials, and GitHub
# Actions (via the same repository secrets the `leaderboard` workflow uses)
# is the only place that does. Delete this file once the migration has run.
name: run-migration-0001

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration 0001 (adds the level column + index)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute eelio --remote --yes --file=./migrations/0001_add_level.sql
